[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc_quant_pro"
version = "2.2.0"
description = "High-frequency/Quantitative BTC trading with dynamic risk management."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "ccxt>=4.2.0",
    "yfinance>=0.2.35",
    "pandas-ta>=0.3.14b0",
    "ta>=0.11.0",
    "backtrader>=1.9.78.123",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "sqlalchemy>=2.0.0",
    "cryptography>=41.0.0",
    "matplotlib>=3.8.0",
    "tenacity>=8.2.0",
    "strenum>=0.4.15",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.10.0",
    "isort>=5.12.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["*"]
